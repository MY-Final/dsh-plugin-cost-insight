# 本地开发 overlay：在 deepseek-harness 源码根目录运行
#
#   pnpm dsh web --patch /absolute/path/to/dsh-plugin-cost-insight/dev/cordis.yml
#
# 插件路径必须为绝对路径（overlay 不改变 profile 的模块解析目录）。
# 把下面的 name 改成这个仓库在你机器上的绝对路径。
#
# 注意：M1 无浏览器半边（/cost 是纯 host 命令），overlay 直接加载即可。
- insert:
    - id: dsh-plugin-cost-insight
      name: '/absolute/path/to/dsh-plugin-cost-insight/src/index.ts'
      config:
        verbose: true
